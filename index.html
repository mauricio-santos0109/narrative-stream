function useReveal(threshold = 0.12) {
  const ref = useRef(null);
  const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } },
      { threshold }
    );
    io.observe(el);
    return () => io.disconnect();
  }, [threshold]);
  return [ref, seen];
}

// ---------------- PROJECTS BACKGROUND SLIDESHOW ----------------
function ProjectsBg({ images, intervalMs = 5000, offset = 0 }) {
  const seq = useMemo(() => {
    if (!images || !images.length) return [];
    const n = ((offset % images.length) + images.length) % images.length;
    return images.slice(n).concat(images.slice(0, n));
  }, [images, offset]);
  const [i, setI] = useState(0);
  useEffect(() => {
    if (!seq.length) return;
    const t = setInterval(() => setI((p) => (p + 1) % seq.length), intervalMs);
    return () => clearInterval(t);
  }, [seq, intervalMs]);
  return (
    <div className="absolute inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
      {seq.map((src, idx) => (
        <img
          key={src + ':' + idx}
          src={src}
          alt=""
          className="absolute inset-0 w-full h-full object-cover transition-opacity ease-in-out"
          style={{
            opacity: i === idx ? 0.16 : 0,
            transitionDuration: '1800ms',
            filter: 'blur(2px) saturate(0.85)',
          }}
        />
      ))}
      <div className="absolute inset-0 bg-gradient-to-b from-bg via-bg/55 to-bg" />
    </div>
  );
}

// ---------------- APP ----------------
function App() {
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem('lang') || 'es'; } catch (_) { return 'es'; }
  });
  useEffect(() => {
    try { localStorage.setItem('lang', lang); } catch (_) {}
    document.documentElement.lang = lang;
  }, [lang]);

  const [done, setDone] = useState(false);
  const [open, setOpen] = useState(null);

  useEffect(() => {
    const tmr = setTimeout(() => setDone(true), 2400);
    return () => clearTimeout(tmr);
  }, []);

  const onJump = (id) => {
    if (id === 'top') { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  };

  const makeOpen = (cat) => (item) => setOpen({ item, category: cat });
  const closeModal = () => setOpen(null);

  return (
    <LangContext.Provider value={lang}>
      <Loader done={done} />
      <Navbar onJump={onJump} lang={lang} setLang={setLang} />
      <main id="top">
        <Hero onPlay={(item, cat) => setOpen({ item, category: cat })} />
        <div id="projects" className="relative py-6 overflow-hidden">
          <ProjectsBg images={PROJECT_SHOTS} />
          <Rail category="Audiovisual" items={PROJECTS.Audiovisual} onOpen={makeOpen('Audiovisual')} />
          <Rail category="Interaction" items={PROJECTS.Interaction} onOpen={makeOpen('Interaction')} />
          <Rail category="Editorial"   items={PROJECTS.Editorial}   onOpen={makeOpen('Editorial')}   />
        </div>
        <About />
        <Contact />
      </main>
      {open && (
        <PlayerModal
          key={open.item.id + ':' + lang}
          project={open.item}
          color={BRAND[open.category].color}
          onClose={closeModal}
        />
      )}
    </LangContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
